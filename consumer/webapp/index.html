<!DOCTYPE html>
<html>

<head>
    <title>[Consumer] Video GUI</title>
     <script src="webapp/index.js" defer></script>
<style>
    h1 {
        font-family: 'Courier New', monospace;
        margin-left: 50px;
    }
    p {
        font-family: 'Courier New', monospace;
        margin-left: 50px;
        font-weight: bold;
    }
    .video-grid-container{
        width:90%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap:10px;
        margin: 0 auto;
    }
    .video-item{
        background-color: #cdcdcd;
        overflow:hidden;
        width: 100%;
        height: auto;
        display:flex;
        flex-direction: column;
        align-items:center;
        padding:10px 0;
    }
    .video-item video {
        cursor: pointer;
        background-color: #000;
    }
    .video-item p {
        margin: 8px 0 0 0;
        padding: 0 8px;
        text-align: center;
        overflow-wrap: anywhere;
    }
</style>

</head>

<body>

<h1>[Consumer] Videos Received</h1>
<p>The videos received from the producers, oldest first. Hover to preview the first 10 seconds, click to play the whole video.</p>
<p id="status"></p>

<!-- filled in by index.js -->
<div class = "video-grid-container"></div>

</body>
</html>
