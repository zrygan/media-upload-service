services:
  consumer:
    build:
      context: .
      dockerfile: ./consumer/Dockerfile
    networks:
      backend:
        ipv4_address: 172.28.0.10
    ports:
      - 9090:9090
    volumes:
      - ./uploads:/uploads
    

  producer:
    build: 
      context: .
      dockerfile: ./producer/Dockerfile
    networks:
      backend:
        ipv4_address: 172.28.0.11
    volumes:
      - ./configs:/workspace/.configs:ro
      - ./videos:/videos:ro
    depends_on:
      - consumer
    
networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/24
    